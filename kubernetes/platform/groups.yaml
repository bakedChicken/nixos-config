apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-groups
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - group: foundation
          - group: data
          - group: identity
          - group: observability
          - group: apps
          - group: edge
  template:
    metadata:
      name: "platform-{{ .group }}"
    spec:
      project: platform
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: oci://ghcr.io/bakedchicken/platform
        targetRevision: latest
        path: "{{ .group }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
