apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mktxp
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - cluster: edge
            server: https://edge.burned.host:6443
  template:
    metadata:
      name: "mktxp-{{ .cluster }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      destination:
        server: "{{ .server }}"
        namespace: mktxp
      source:
        repoURL: oci://ghcr.io/bakedchicken/platform
        targetRevision: latest
        path: mktxp
      syncPolicy:
