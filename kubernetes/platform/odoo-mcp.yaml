            config_parameter="mn_mcp.self_models",
            help="Comma-separated. '*' means everything that user can already see.")
        mcp_self_read = fields.Boolean(string="Self-service: read",
            config_parameter="mn_mcp.self_read", default=True)
        mcp_self_write = fields.Boolean(string="Self-service: update",
            config_parameter="mn_mcp.self_write", default=False)
        mcp_self_create = fields.Boolean(string="Self-service: create",
            config_parameter="mn_mcp.self_create", default=False)
        mcp_self_unlink = fields.Boolean(string="Self-service: delete",
            config_parameter="mn_mcp.self_unlink", default=False,
            help="Off by default, and it should usually stay off. A key a user "
                 "issued for themselves is the last one that should be able to "
                 "delete anything.")
        mcp_self_quota = fields.Integer(string="Self-service daily quota",
            config_parameter="mn_mcp.self_quota", default=500)
        mcp_self_rate = fields.Integer(string="Self-service rate (per minute)",
            config_parameter="mn_mcp.self_rate", default=30)
        mcp_self_max_keys = fields.Integer(string="Keys per user",
            config_parameter="mn_mcp.self_max_keys", default=3)

        # The default-models list is stored as a CSV config parameter; load/save it
        # through a friendly model picker.
        def get_values(self):
            res = super().get_values()
            csv = self.env["ir.config_parameter"].sudo().get_param("mn_mcp.default_models", "")
            names = [m.strip() for m in csv.split(",") if m.strip()]
            models = self.env["ir.model"].search([("model", "in", names)]) if names else self.env["ir.model"]
            res["mcp_default_model_ids"] = [(6, 0, models.ids)]
            return res

        def set_values(self):
            super().set_values()
            csv = ",".join(sorted(self.mcp_default_model_ids.mapped("model")))
            self.env["ir.config_parameter"].sudo().set_param("mn_mcp.default_models", csv)
