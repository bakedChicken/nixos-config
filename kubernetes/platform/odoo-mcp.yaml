                    <list>
                        <field name="sequence" widget="handle"/>
                        <field name="name"/>
                        <field name="title"/>
                        <field name="category"/>
                        <field name="active" widget="boolean_toggle"/>
                    </list>
                </field>
            </record>
            <record id="view_prompt_form" model="ir.ui.view">
                <field name="name">mn.mcp.prompt.form</field>
                <field name="model">mn.mcp.prompt</field>
                <field name="arch" type="xml">
                    <form>
                        <sheet>
                            <group>
                                <group>
                                    <field name="name"/>
                                    <field name="title"/>
                                    <field name="category"/>
                                    <field name="active"/>
                                </group>
                                <group>
                                    <field name="description"/>
                                </group>
