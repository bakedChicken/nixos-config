            try:
                text = json.dumps(payload, default=str)
            except Exception:  # noqa: BLE001
                text = str(payload)
            out = {"content": [{"type": "text", "text": text}]}
            if isinstance(payload, dict):
                out["structuredContent"] = json.loads(json.dumps(payload, default=str))
            return out

