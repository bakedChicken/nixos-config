                      action="action_api_key" sequence="10"/>
            <menuitem id="menu_custom_tools" name="Custom Tools" parent="menu_root"
                      action="action_mcp_tool" sequence="20"/>

            <menuitem id="menu_oauth_clients" name="OAuth Clients" parent="menu_root"
                      action="action_mcp_oauth_client" sequence="25"/>
            <menuitem id="menu_oauth_tokens" name="OAuth Tokens" parent="menu_root"
                      action="action_mcp_oauth_token" sequence="26"/>

            <menuitem id="menu_playground" name="Playground" parent="menu_root"
                      action="action_mcp_playground" sequence="8"
                      groups="group_mcp_manager"/>

            <menuitem id="menu_semantic" name="Semantic Layer" parent="menu_root"
                      sequence="18"/>
            <menuitem id="menu_glossary" name="Business Glossary" parent="menu_semantic"
                      action="action_mcp_glossary" sequence="10"/>
            <menuitem id="menu_metrics" name="Business Metrics" parent="menu_semantic"
                      action="action_mcp_metric" sequence="20"/>
            <menuitem id="menu_model_hints" name="Model Hints" parent="menu_semantic"
                      action="action_mcp_model_hint" sequence="30"/>
            <menuitem id="menu_exposed_tools" name="Exposed Tools" parent="menu_semantic"
                      action="action_mcp_tool_choice" sequence="40"/>

            <menuitem id="menu_prompts" name="Prompts Library" parent="menu_root"
                      action="action_prompt" sequence="15"/>
            <menuitem id="menu_audit" name="Audit Log" parent="menu_root"
                      action="action_audit" sequence="20"/>
            <menuitem id="menu_webhooks" name="Security Webhooks" parent="menu_root"
                      action="action_webhook" sequence="25"
                      groups="group_mcp_manager"/>
            <menuitem id="menu_settings" name="Settings" parent="menu_root"
                      action="action_mcp_settings" sequence="90"
                      groups="group_mcp_manager"/>
        </data>
    </odoo>
  views__oauth_templates.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <odoo>

        <!-- The consent screen. Deliberately plain and specific: a user should be
             able to read exactly which system is asking, as whom they will act,
             and what it will be able to do.

             Built on web.layout, not web.frontend_layout: the latter reaches for
             the website module's rendering context and 500s on an install that
             does not have it. This module must run anywhere Odoo runs. -->
        <template id="oauth_consent" name="MCP: authorise application">
            <t t-call="web.layout">
                <t t-set="html_data" t-value="{'lang': 'en-US'}"/>
                <div style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                            background:#0F1117;min-height:100vh;margin:0;padding:60px 20px;">
                    <div style="max-width:520px;margin:0 auto;background:#FFFFFF;
                                border-radius:14px;padding:32px;
                                box-shadow:0 10px 40px rgba(0,0,0,.35);">

                        <div style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;
                                    color:#8B5CF6;font-weight:700;margin-bottom:10px;">
                            Authorise application
                        </div>

                        <h2 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#0F1117;">
                            <span t-field="client.name"/> wants to connect to Odoo
                        </h2>

                        <p style="color:#475569;line-height:1.7;margin:0 0 20px;">
                            It will act as <b t-field="user.name"/>
                            (<span t-field="user.login"/>) and can only see and do what
                            that account is already allowed to.
                        </p>

                        <div style="border:1px solid #E2E8F0;border-radius:10px;
                                    padding:16px 18px;margin-bottom:18px;">
                            <div style="font-weight:700;margin-bottom:10px;color:#0F1117;">
                                This will allow it to:
                            </div>
                            <ul style="margin:0;padding-left:20px;color:#475569;line-height:1.9;">
                                <li t-if="'odoo:read' in scope">Read records you can read</li>
                                <li t-if="'odoo:write' in scope">
                                    Create and update records you can edit
                                </li>
                                <li t-if="'odoo:admin' in scope" style="color:#DC2626;">
                                    Delete records you can delete
                                </li>
                            </ul>
                        </div>

                        <div style="font-size:12px;color:#94A3B8;margin-bottom:20px;
                                    word-break:break-all;">
                            Requested by <span t-field="client.client_id"/>
                        </div>

                        <form method="post" action="/mcp/oauth/authorize">
                            <input type="hidden" name="csrf_token"
                                   t-att-value="request.csrf_token()"/>
                            <t t-foreach="params.items()" t-as="param">
                                <input type="hidden" t-att-name="param[0]"
                                       t-att-value="param[1]"/>
                            </t>
                            <button type="submit" name="decision" value="allow"
                                    style="width:100%;background:#8B5CF6;color:#fff;border:none;
                                           border-radius:9px;padding:13px;font-size:15px;
                                           font-weight:700;cursor:pointer;margin-bottom:10px;">
                                Allow
                            </button>
                            <button type="submit" name="decision" value="deny"
                                    style="width:100%;background:#F1F5F9;color:#334155;
                                           border:none;border-radius:9px;padding:13px;
                                           font-size:15px;cursor:pointer;">
                                Deny
                            </button>
                        </form>
                    </div>

                    <div style="text-align:center;color:#64748B;font-size:12px;margin-top:18px;">
                        You can revoke this at any time in Odoo under
                        MCP Server &#8250; OAuth Clients.
                    </div>
                </div>
            </t>
        </template>

    </odoo>
  views__portal_templates.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <odoo>

        <!-- /my/mcp — a user issues and revokes their own key.

             Built on web.layout rather than portal.portal_layout or
             web.frontend_layout: both of those reach for modules this one does not
             depend on, and this module must install on a bare Odoo. Styling is
             inline for the same reason — there is no guarantee a frontend asset
             bundle is even being served here. -->
        <template id="portal_mcp_keys" name="MCP: my keys">
            <t t-call="web.layout">
                <t t-set="html_data" t-value="{'lang': 'en-US'}"/>
                <div style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                            background:#F5F6FA;min-height:100vh;margin:0;padding:48px 20px;">
                    <div style="max-width:760px;margin:0 auto;">

                        <div style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;
                                    color:#8B5CF6;font-weight:700;margin-bottom:8px;">
                            Model Context Protocol
                        </div>
                        <h1 style="margin:0 0 6px;font-size:26px;color:#0F1117;">My AI connection keys</h1>
                        <p style="color:#475569;line-height:1.7;margin:0 0 26px;">
                            A key lets an AI assistant read Odoo <b>as you</b>. It can never see
                            or do more than your own Odoo account allows.
                        </p>

                        <!-- Messages -->
                        <t t-if="error">
                            <div style="background:#FEF2F2;border:1px solid #FCA5A5;color:#7F1D1D;
                                        border-radius:10px;padding:14px 16px;margin-bottom:20px;">
                                <t t-esc="error"/>
                            </div>
                        </t>
                        <t t-if="info">
                            <div style="background:#F0FDF4;border:1px solid #86EFAC;color:#14532D;
                                        border-radius:10px;padding:14px 16px;margin-bottom:20px;">
                                <t t-esc="info"/>
                            </div>
                        </t>

                        <!-- The one and only time this token is ever shown. -->
                        <t t-if="new_token">
                            <div style="background:#FFFFFF;border:2px solid #8B5CF6;border-radius:12px;
                                        padding:20px 22px;margin-bottom:24px;">
                                <div style="font-weight:700;color:#0F1117;margin-bottom:6px;">
                                    Copy this now — it is shown once
                                </div>
                                <p style="color:#475569;margin:0 0 12px;line-height:1.6;">
                                    Odoo stores only a hash of it. If you lose it, revoke the key
                                    and issue another.
                                </p>
                                <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
                                            font-size:13px;background:#0F1117;color:#E2E8F0;
                                            border-radius:8px;padding:14px;word-break:break-all;">
                                    <t t-esc="new_token"/>
                                </div>
                                <div style="font-weight:700;color:#0F1117;margin:18px 0 6px;">
                                    Connector URL
                                </div>
                                <p style="color:#475569;margin:0 0 10px;line-height:1.6;">
                                    Paste this into your AI client's "add a custom connector" box.
                                </p>
                                <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
                                            font-size:12px;background:#F1F5F9;color:#0F1117;
                                            border:1px solid #E2E8F0;border-radius:8px;padding:12px;
                                            word-break:break-all;">
                                    <t t-esc="new_connect_url"/>
                                </div>
                            </div>
                        </t>

                        <!-- What a key issued here is allowed to do. -->
                        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;
                                    padding:20px 22px;margin-bottom:24px;">
                            <div style="font-weight:700;color:#0F1117;margin-bottom:10px;">
                                What a key from this page can do
                            </div>
                            <table style="width:100%; border-collapse:collapse;color:#475569;">
                                <tr>
                                    <td style="padding:6px 0;">Models it may touch</td>
                                    <td style="padding:6px 0;color:#0F1117;font-weight:600;">
                                        <t t-if="template['allowed_models'] == '*'">Everything you can see</t>
                                        <t t-elif="template['allowed_models']">
                                            <t t-esc="template['allowed_models']"/>
                                        </t>
                                        <t t-else="">Nothing yet — ask your administrator</t>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:6px 0;">Permissions</td>
                                    <td style="padding:6px 0;color:#0F1117;font-weight:600;">
                                        <t t-if="template['perm_read']">Read </t>
                                        <t t-if="template['perm_create']">· Create </t>
                                        <t t-if="template['perm_write']">· Update </t>
                                        <t t-if="template['perm_unlink']">· Delete</t>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:6px 0;">Daily limit</td>
                                    <td style="padding:6px 0;color:#0F1117;font-weight:600;">
                                        <t t-esc="template['daily_quota']"/> calls
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:6px 0;">Keys you may hold</td>
                                    <td style="padding:6px 0;color:#0F1117;font-weight:600;">
                                        <t t-esc="template['max_keys']"/>
                                    </td>
                                </tr>
                            </table>
                        </div>

                        <!-- Issue -->
                        <t t-if="not at_limit">
                            <form action="/my/mcp/new" method="post"
                                  style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;
                                         padding:20px 22px;margin-bottom:24px;">
                                <input type="hidden" name="csrf_token" t-att-value="request.csrf_token()"/>
                                <div style="font-weight:700;color:#0F1117;margin-bottom:10px;">
                                    Issue a new key
                                </div>
                                <input type="text" name="name" placeholder="What is it for? e.g. Claude on my laptop"
                                       style="width:100%;box-sizing:border-box;padding:11px 13px;
                                              border:1px solid #CBD5E1;border-radius:8px;font-size:14px;
                                              margin-bottom:12px;"/>
                                <button type="submit"
                                        style="background:#8B5CF6;color:#FFFFFF;border:0;border-radius:8px;
                                               padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;">
                                    Issue key
                                </button>
                            </form>
                        </t>
                        <t t-else="">
                            <div style="background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;
                                        border-radius:10px;padding:14px 16px;margin-bottom:24px;">
                                You are holding the maximum number of active keys. Revoke one to issue another.
                            </div>
                        </t>

                        <!-- Existing -->
                        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;
                                    padding:20px 22px;">
                            <div style="font-weight:700;color:#0F1117;margin-bottom:12px;">Your keys</div>
                            <t t-if="not keys">
                                <p style="color:#64748B;margin:0;">You have not issued any yet.</p>
                            </t>
                            <t t-foreach="keys" t-as="key">
                                <div style="display:flex;align-items:center;justify-content:space-between;
                                            gap:12px;border-top:1px solid #F1F5F9;padding:12px 0;">
                                    <div>
                                        <div style="color:#0F1117;font-weight:600;"><t t-esc="key.name"/></div>
                                        <div style="color:#64748B;font-size:13px;">
                                            <t t-esc="key.total_calls"/> calls ·
                                            <t t-esc="key.usage_today"/> today ·
                                            <t t-if="key.last_used">last used <t t-esc="key.last_used"/></t>
                                            <t t-else="">never used</t>
                                        </div>
                                    </div>
                                    <div>
                                        <t t-if="key.state == 'active'">
                                            <form t-attf-action="/my/mcp/revoke/#{key.id}" method="post"
                                                  style="margin:0;">
                                                <input type="hidden" name="csrf_token"
                                                       t-att-value="request.csrf_token()"/>
                                                <button type="submit"
                                                        style="background:#FFFFFF;color:#B91C1C;
                                                               border:1px solid #FCA5A5;border-radius:8px;
                                                               padding:8px 14px;font-size:13px;font-weight:600;
                                                               cursor:pointer;">
                                                    Revoke
                                                </button>
                                            </form>
                                        </t>
                                        <t t-else="">
                                            <span style="color:#94A3B8;font-size:13px;">Revoked</span>
                                        </t>
                                    </div>
                                </div>
                            </t>
                        </div>

                    </div>
                </div>
            </t>
        </template>

    </odoo>
  views__res_config_settings_views.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <odoo>
        <data>
            <record id="view_mcp_settings" model="ir.ui.view">
                <field name="name">res.config.settings.mcp</field>
                <field name="model">res.config.settings</field>
                <field name="inherit_id" ref="base.res_config_settings_view_form"/>
                <field name="arch" type="xml">
                    <xpath expr="//form" position="inside">
                        <app data-string="MCP Server" string="MCP Server" name="mn_mcp_server"
                             groups="mn_mcp_server.group_mcp_manager">
                            <block title="Endpoint" name="mcp_endpoint">
                                <setting id="mcp_on" string="MCP endpoint enabled">
                                    <field name="mcp_enabled"/>
                                </setting>
                                <setting id="mcp_pub" string="Public MCP URL"
                                         help="Full HTTPS URL of the /mcp endpoint if Odoo is behind a reverse proxy. Used in the Connect-to-Claude links.">
                                    <field name="mcp_public_url" placeholder="https://erp.mycompany.com/mcp"/>
                                </setting>
                                <setting id="mcp_models" string="Default allowed models"
                                         help="Models pre-selected when creating a new API key.">
                                    <field name="mcp_default_model_ids" widget="many2many_tags"
                                           options="{'no_create': True}"
                                           placeholder="Select models…"/>
                                </setting>
                                <setting id="mcp_cap" string="Max records per call">
                                    <field name="mcp_max_records"/>
                                </setting>
                                <setting id="mcp_ret" string="Audit retention (days)">
                                    <field name="mcp_audit_retention_days"/>
                                </setting>
                            </block>
                            <block title="Guard rails"
                                   help="Odoo's access rules stop the AI doing what the user may not do. These stop it doing something the user could do but did not mean to.">
                                <setting id="mcp_confirm" string="Ask before destructive actions"
                                         help="Deleting, bulk edits and method calls stop until a human confirms. Clients that support elicitation show a prompt; the rest are told to re-call with confirm: true.">
                                    <field name="mcp_confirm_enabled"/>
                                </setting>
                                <setting id="mcp_confirm_write" string="Confirm updates over N records"
                                         invisible="not mcp_confirm_enabled">
                                    <field name="mcp_confirm_write_over"/>
                                </setting>
                                <setting id="mcp_confirm_create" string="Confirm bulk create over N records"
                                         invisible="not mcp_confirm_enabled">
                                    <field name="mcp_confirm_create_over"/>
                                </setting>
                                <setting id="mcp_confirm_exec" string="Confirm arbitrary method calls"
                                         invisible="not mcp_confirm_enabled">
                                    <field name="mcp_confirm_execute"/>
                                </setting>
                            </block>
                            <block title="Self-service keys"
                                   help="One administrator issuing keys by hand stops working at about six colleagues — and then somebody makes one shared key with every permission, which is exactly what scoping exists to prevent.">
                                <setting id="mcp_self" string="Let users issue their own keys"
                                         help="Opens /my/mcp for anyone in the MCP User group. They choose a label; everything else comes from this template, so a user can never widen their own key.">
                                    <field name="mcp_self_service"/>
                                </setting>
                                <setting id="mcp_self_m" string="Models a self-service key may reach"
                                         invisible="not mcp_self_service"
                                         help="Comma-separated model names. '*' means everything that user can already see in Odoo.">
                                    <field name="mcp_self_models"
                                           placeholder="res.partner,sale.order,account.move"/>
                                </setting>
                                <setting id="mcp_self_p" string="Permissions granted"
                                         invisible="not mcp_self_service">
                                    <div>
                                        <field name="mcp_self_read"/>
                                        <label for="mcp_self_read" string="Read"/>
                                    </div>
                                    <div>
                                        <field name="mcp_self_create"/>
                                        <label for="mcp_self_create" string="Create"/>
                                    </div>
                                    <div>
                                        <field name="mcp_self_write"/>
                                        <label for="mcp_self_write" string="Update"/>
                                    </div>
                                    <div>
                                        <field name="mcp_self_unlink"/>
                                        <label for="mcp_self_unlink" string="Delete"/>
                                    </div>
                                </setting>
                                <setting id="mcp_self_q" string="Daily quota"
                                         invisible="not mcp_self_service">
                                    <field name="mcp_self_quota"/>
                                </setting>
                                <setting id="mcp_self_r" string="Rate limit (per minute)"
                                         invisible="not mcp_self_service">
                                    <field name="mcp_self_rate"/>
                                </setting>
                                <setting id="mcp_self_k" string="Keys per user"
                                         invisible="not mcp_self_service">
                                    <field name="mcp_self_max_keys"/>
                                </setting>
                            </block>
                        </app>
                    </xpath>
                </field>
            </record>
            <record id="action_mcp_settings" model="ir.actions.act_window">
                <field name="name">MCP Settings</field>
                <field name="res_model">res.config.settings</field>
                <field name="view_mode">form</field>
                <field name="target">current</field>
                <field name="context">{'module': 'mn_mcp_server'}</field>
            </record>
        </data>
    </odoo>
