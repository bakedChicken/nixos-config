apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argocd.yaml
  - beer-tree.yaml
  - grafana.yaml
  - keycloak-config.yaml
  - keycloak.yaml
  - kiali.yaml
  - nextcloud.yaml
  - openbao.yaml
  - rustfs.yaml
  - zulip.yaml
patches:
  - target:
      kind: ExternalSecret
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: all
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: openbao
