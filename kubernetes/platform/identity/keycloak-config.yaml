apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "53"
data:
  burned.yaml: |
    realm: burned
    roles:
      client:
        rustfs-console:
          - name: consoleAdmin
    groups:
      - name: admin
        clientRoles:
          rustfs-console:
            - consoleAdmin
      - name: readonly
    clients:
      - clientId: nextcloud
        name: Nextcloud
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:NEXTCLOUD_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://nextcloud.burned.host/*"
        webOrigins:
          - "https://nextcloud.burned.host"
      - clientId: kiali
        name: Kiali
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:KIALI_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://kiali.internal.k8s.burned.host/*"
        webOrigins:
          - "https://kiali.internal.k8s.burned.host"
      - clientId: beer-tree-admin
        name: Beer Tree admin
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:BEER_TREE_ADMIN_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://beer-tree.internal.k8s.burned.host/oauth2/callback"
        webOrigins:
          - "https://beer-tree.internal.k8s.burned.host"
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          - name: beer-tree-admin-groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
      - clientId: zulip
        name: Zulip
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:ZULIP_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://zulip.burned.host/complete/oidc/"
        webOrigins:
          - "https://zulip.burned.host"
      - clientId: rustfs-console
        name: RustFS Console
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:RUSTFS_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://rustfs.internal.k8s.burned.host/rustfs/admin/v3/oidc/callback/default"
        webOrigins:
          - "https://rustfs.internal.k8s.burned.host"
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://rustfs.internal.k8s.burned.host/*
        protocolMappers:
          - name: rustfs-client-roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-client-role-mapper
            config:
              usermodel.clientRoleMapping.clientId: rustfs-console
              multivalued: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
      - clientId: grafana
        name: Grafana
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:GRAFANA_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://grafana.internal.k8s.burned.host/login/generic_oauth"
        webOrigins:
          - "https://grafana.internal.k8s.burned.host"
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          - name: grafana-groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
      - clientId: openbao
        name: OpenBao
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:OPENBAO_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://openbao.internal.k8s.burned.host/ui/vault/auth/sso/keycloak/oidc/callback"
          - "https://openbao.internal.k8s.burned.host/v1/auth/sso/keycloak/oidc/callback"
          - "http://localhost:8250/oidc/callback"
        webOrigins:
          - "https://openbao.internal.k8s.burned.host"
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          - name: openbao-groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
      - clientId: argocd
        name: Argo CD
        enabled: true
        clientAuthenticatorType: client-secret
        secret: "$(env:ARGOCD_CLIENT_SECRET)"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://argocd.internal.k8s.burned.host/auth/callback"
        webOrigins:
          - "https://argocd.internal.k8s.burned.host"
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          - name: argocd-groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "54"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-config-cli
          image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak-service.keycloak.svc.cluster.local:8080
            - name: KEYCLOAK_GRANTTYPE
              value: client_credentials
            - name: KEYCLOAK_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: client-id
            - name: KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: client-secret
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 300s
            - name: IMPORT_FILES_LOCATIONS
              value: /config/burned.yaml
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: NEXTCLOUD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc-client-secret
                  key: client_secret
            - name: KIALI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kiali-oidc-client-secret
                  key: client_secret
            - name: BEER_TREE_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: beer-tree-admin-oidc-client-secret
                  key: client_secret
            - name: ZULIP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zulip-oidc-client-secret
                  key: client_secret
            - name: RUSTFS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rustfs-oidc-client-secret
                  key: client_secret
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc-client-secret
                  key: client_secret
            - name: OPENBAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbao-oidc-client-secret
                  key: client_secret
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-oidc-client-secret
                  key: client_secret
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: keycloak-config
