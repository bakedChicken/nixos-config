apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beer-tree-admin-oidc-client
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "53"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
