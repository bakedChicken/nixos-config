apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc-client
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "53"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-oidc-client
  dataFrom:
    - extract:
        key: nextcloud/oidc-client
---
