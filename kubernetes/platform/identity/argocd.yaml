apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  target:
    name: argocd-oidc-client-secret
  dataFrom:
    - extract:
        key: argocd/oidc-client
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  target:
    name: argocd-oidc-client-secret
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  dataFrom:
    - extract:
        key: argocd/oidc-client
