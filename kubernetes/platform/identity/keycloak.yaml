apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    istio.io/dataplane-mode: ambient
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-mesh
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
  ingress:
    - ports:
        - port: 15008
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
  rules:
    - to:
        - operation:
            ports: ["8080"]
    - from:
        - source:
            namespaces: ["keycloak"]
      to:
        - operation:
            ports: ["7800", "57800"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak-operator
  sources:
    - repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
      targetRevision: 26.8.0
      path: kubernetes/cluster-wide
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  cluster:
    name: default-postgres-cluster
  name: keycloak
  login: true
  passwordSecret:
    name: keycloak-pg-creds
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  cluster:
    name: default-postgres-cluster
  name: keycloak
  owner: keycloak
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pg-creds
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  target:
    name: keycloak-pg-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: keycloak/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pg-creds
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  target:
    name: keycloak-pg-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: keycloak/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  target:
    name: keycloak-bootstrap-admin
    template:
      data:
        client-id: keycloak-config-cli
        client-secret: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: keycloak/bootstrap-admin
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "51"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 2
  bootstrapAdmin:
    service:
      secret: keycloak-bootstrap-admin
  db:
    vendor: postgres
    host: default-postgres-cluster-rw.postgres.svc.cluster.local
    usernameSecret:
      name: keycloak-pg-creds
      key: username
    passwordSecret:
      name: keycloak-pg-creds
      key: password
  hostname:
    hostname: auth.burned.host
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: burned
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "52"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keycloakCRName: keycloak
  placeholders:
    ADMIN_PASSWORD_HASH:
      secret:
        name: keycloak-admin-password
        key: hash
    ADMIN_PASSWORD_SALT:
      secret:
        name: keycloak-admin-password
        key: salt
  realm:
    realm: burned
    displayName: Burned
    enabled: true
    sslRequired: external
    registrationEmailAsUsername: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    groups:
      - name: admin
      - name: readonly
    users:
      - id: 434aca5f-5979-407c-b700-fe8c257ce09c
        username: admin@burned.host
        email: admin@burned.host
        firstName: Artur
        lastName: Luppov
        enabled: true
        emailVerified: true
        credentials:
          - type: password
            secretData: '{"value":"${ADMIN_PASSWORD_HASH}","salt":"${ADMIN_PASSWORD_SALT}","additionalParameters":{}}'
            credentialData: '{"hashIterations":210000,"algorithm":"pbkdf2-sha512","additionalParameters":{}}'
        groups:
          - admin
        clientRoles:
          realm-management:
            - realm-admin
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "52"
spec:
  parentRefs:
    - name: burned-gateway
      namespace: gateway-system
      sectionName: wildcard-https
  hostnames:
    - auth.burned.host
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
