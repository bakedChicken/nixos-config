apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-rustfs-creds
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "69"
spec:
  target:
    name: tempo-rustfs-creds
    template:
      data:
        AWS_ACCESS_KEY_ID: tempo
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: tempo/rustfs
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  destination:
    namespace: observability
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: tempo
      targetRevision: 3.1.0
      helm:
        valuesObject:
          podAnnotations:
            prometheus.io/port: "3200"
            prometheus.io/scrape: "true"
          tempo:
            extraArgs:
              config.expand-env: "true"
            extraEnvFrom:
              - secretRef:
                  name: tempo-rustfs-creds
            storage:
              trace:
                backend: s3
                s3:
                  access_key: ${AWS_ACCESS_KEY_ID}
                  bucket: tempo
                  endpoint: rustfs-svc.rustfs-system.svc.cluster.local:9000
                  insecure: true
                  secret_key: ${AWS_SECRET_ACCESS_KEY}
