apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: cert-manager
  sources:
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        valuesObject:
          config:
            gatewayAPI:
              enabled: true
              enableListenerSet: true
            featureGates:
              ListenerSets: true
          crds:
            enabled: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
