apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: zulip.db
  namespace: openbao
spec:
  path: secret/data/zulip
  name: db
  secretKey: password
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: redhatcop.redhat.io/v1alpha1
