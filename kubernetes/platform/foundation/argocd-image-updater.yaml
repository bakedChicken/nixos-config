apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.2
      helm:
        valuesObject:
          # ghcr.io with the same token Argo CD pulls the platform with (ghcr-bakedchicken, rendered
          # by NixOS): private images, and no anonymous rate limit while reading tags.
          config:
            registries:
              - name: GitHub Container Registry
                api_url: https://ghcr.io
                prefix: ghcr.io
                ping: false
                credentials: env:GHCR_CREDENTIALS
          extraEnv:
            - name: GHCR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ghcr-bakedchicken
                  key: username
            - name: GHCR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghcr-bakedchicken
                  key: password
            - name: GHCR_CREDENTIALS
              value: $(GHCR_USERNAME):$(GHCR_PASSWORD)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
