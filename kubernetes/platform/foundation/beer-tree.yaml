apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: beer-tree.db
  namespace: openbao
spec:
  path: secret/data/beer-tree
  name: db
  secretKey: password
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
