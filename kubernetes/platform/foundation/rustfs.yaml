apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: rustfs.oidc-client
  namespace: openbao
spec:
  path: secret/data/rustfs
  name: oidc-client
  secretKey: client_secret
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: rustfs.root
  namespace: openbao
spec:
  path: secret/data/rustfs
  name: root
  secretKey: secret_key
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
