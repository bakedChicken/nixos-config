# Workspace module: workstreams, projects in stages, decisions and the dashboard (the collaboration platform).
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-burned-workspace
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: "90"
data:
  __init__.py: |
    from . import models
  __manifest__.py: |
    {
        "name": "Burned workspace",
        "summary": "Workstreams, decisions and a dashboard on top of Project",
        "author": "Artur Luppov",
        "version": "19.0.1.0.0",
        "depends": ["mail", "project"],
        "data": ["ir.model.access.csv", "views.xml", "data.xml"],
        "application": True,
        "license": "LGPL-3",
    }
  models.py: |
    from odoo import api, fields, models
    from odoo.fields import Command

    STAGE_REFS = {
        "idea": "project.project_project_stage_0",
        "proposal": "project.project_project_stage_1",
        "approved": "burned_workspace.project_stage_approved",
        "active": "burned_workspace.project_stage_active",
    }


    class Workstream(models.Model):
        _name = "burned.workstream"
        _description = "Workstream"
        _order = "sequence, name"

        name = fields.Char(required=True)
        sequence = fields.Integer(default=10)
        color = fields.Integer()
        active = fields.Boolean(default=True)
        user_id = fields.Many2one("res.users", string="Owner", default=lambda self: self.env.ref("base.user_admin"))
        description = fields.Text()
        project_ids = fields.One2many("project.project", "burned_workstream_id", string="Projects")
        decision_ids = fields.One2many("burned.decision", "workstream_id", string="Decisions")
        decision_open_count = fields.Integer(compute="_compute_counts")
        project_idea_count = fields.Integer(compute="_compute_counts")
        project_proposal_count = fields.Integer(compute="_compute_counts")
        project_approved_count = fields.Integer(compute="_compute_counts")
        project_active_count = fields.Integer(compute="_compute_counts")

        def _compute_counts(self):
            stages = {key: self.env.ref(xmlid, raise_if_not_found=False) for key, xmlid in STAGE_REFS.items()}
            for workstream in self:
                workstream.decision_open_count = len(workstream.decision_ids.filtered(lambda d: d.state == "open"))
                for key, stage in stages.items():
                    count = len(workstream.project_ids.filtered(lambda p, s=stage: s and p.stage_id == s))
                    workstream[f"project_{key}_count"] = count

        def action_open_decisions(self):
            self.ensure_one()
            action = self.env["ir.actions.act_window"]._for_xml_id("burned_workspace.action_decisions")
            action["domain"] = [("workstream_id", "=", self.id)]
            action["context"] = {"search_default_open": 1}
            return action

        def action_open_projects(self):
            self.ensure_one()
            action = self.env["ir.actions.act_window"]._for_xml_id("project.open_view_project_all")
            action["domain"] = [("burned_workstream_id", "=", self.id)]
            action["context"] = {"default_burned_workstream_id": self.id}
            return action


    class ProjectTaskType(models.Model):
        _inherit = "project.task.type"

        burned_default = fields.Boolean("Default for workspace projects")


    class Project(models.Model):
        _inherit = "project.project"

        burned_workstream_id = fields.Many2one("burned.workstream", string="Workstream", index=True, tracking=True)
        burned_decision_ids = fields.One2many("burned.decision", "project_id", string="Decisions")

        @api.model_create_multi
        def create(self, vals_list):
            projects = super().create(vals_list)
            stages = self.env["project.task.type"].search([("burned_default", "=", True)])
            if stages:
                stages.write({"project_ids": [Command.link(project.id) for project in projects]})
            return projects


    class Decision(models.Model):
        _name = "burned.decision"
        _description = "Decision"
        _inherit = ["mail.thread", "mail.activity.mixin"]
        _order = "deadline, id desc"

        name = fields.Char("Question", required=True, tracking=True)
        context = fields.Html()
        option_ids = fields.One2many("burned.decision.option", "decision_id", string="Options")
        answer_option_id = fields.Many2one("burned.decision.option", string="Answer", readonly=True, tracking=True)
        answer_note = fields.Text("Note")
        state = fields.Selection(
            [("open", "Open"), ("answered", "Answered"), ("cancelled", "Cancelled")],
            default="open", required=True, tracking=True,
        )
        deadline = fields.Date(tracking=True)
        project_id = fields.Many2one("project.project", index=True)
        task_id = fields.Many2one("project.task", index=True)
        workstream_id = fields.Many2one("burned.workstream", compute="_compute_workstream", store=True, index=True)
        requested_by_id = fields.Many2one("res.users", string="Asked by", default=lambda self: self.env.user, readonly=True)
        answered_by_id = fields.Many2one("res.users", string="Answered by", readonly=True)
        answered_at = fields.Datetime(readonly=True)

        @api.depends("project_id.burned_workstream_id", "task_id.project_id.burned_workstream_id")
        def _compute_workstream(self):
            for decision in self:
                project = decision.project_id or decision.task_id.project_id
                decision.workstream_id = project.burned_workstream_id

        @api.model_create_multi
        def create(self, vals_list):
            decisions = super().create(vals_list)
            admin = self.env.ref("base.user_admin")
            for decision in decisions:
                owner = decision.workstream_id.user_id or admin
                decision.activity_schedule(
                    "mail.mail_activity_data_todo",
                    date_deadline=decision.deadline or fields.Date.context_today(decision),
                    summary="Decision needed",
                    user_id=owner.id,
                )
            return decisions

        def _answer(self, option):
            self.ensure_one()
            self.write({
                "answer_option_id": option.id,
                "state": "answered",
                "answered_by_id": self.env.uid,
                "answered_at": fields.Datetime.now(),
            })
            self.activity_ids.action_feedback(feedback=f"Answered: {option.name}")

        def action_cancel(self):
            self.write({"state": "cancelled"})
            self.activity_ids.unlink()


    class DecisionOption(models.Model):
        _name = "burned.decision.option"
        _description = "Decision option"
        _order = "sequence, id"

        decision_id = fields.Many2one("burned.decision", required=True, ondelete="cascade", index=True)
        sequence = fields.Integer(default=10)
        name = fields.Char("Option", required=True)
        description = fields.Text()
        is_recommended = fields.Boolean("Recommended")

        def action_choose(self):
            self.ensure_one()
            self.decision_id._answer(self)
  ir.model.access.csv: |
    id,name,model_id:id,group_id:id,perm_read,perm_write,perm_create,perm_unlink
    access_workstream_user,workstream user,model_burned_workstream,base.group_user,1,1,1,1
    access_decision_user,decision user,model_burned_decision,base.group_user,1,1,1,1
    access_decision_option_user,decision option user,model_burned_decision_option,base.group_user,1,1,1,1
  views.xml: |
    <odoo>
      <!-- Decisions -->
      <record id="view_decision_list" model="ir.ui.view">
        <field name="name">burned.decision.list</field>
        <field name="model">burned.decision</field>
        <field name="arch" type="xml">
          <list decoration-muted="state != 'open'" decoration-danger="state == 'open' and deadline and deadline &lt; current_date">
            <field name="name"/>
            <field name="workstream_id"/>
            <field name="project_id"/>
            <field name="deadline"/>
            <field name="requested_by_id" widget="many2one_avatar_user"/>
            <field name="answer_option_id"/>
            <field name="state" widget="badge" decoration-warning="state == 'open'" decoration-success="state == 'answered'"/>
          </list>
        </field>
      </record>

      <record id="view_decision_form" model="ir.ui.view">
        <field name="name">burned.decision.form</field>
        <field name="model">burned.decision</field>
        <field name="arch" type="xml">
          <form>
            <header>
              <button name="action_cancel" type="object" string="Cancel decision" invisible="state != 'open'"/>
              <field name="state" widget="statusbar" statusbar_visible="open,answered"/>
            </header>
            <sheet>
              <div class="oe_title">
                <h1><field name="name" placeholder="The question"/></h1>
              </div>
              <group>
                <group>
                  <field name="project_id"/>
                  <field name="task_id"/>
                  <field name="workstream_id"/>
                </group>
                <group>
                  <field name="deadline"/>
                  <field name="requested_by_id" widget="many2one_avatar_user"/>
                  <field name="answered_by_id" widget="many2one_avatar_user" invisible="state == 'open'"/>
                  <field name="answered_at" invisible="state == 'open'"/>
                </group>
              </group>
              <field name="context" placeholder="What this is about, and what depends on it"/>
              <separator string="Options"/>
              <field name="option_ids" readonly="state != 'open'">
                <list editable="bottom">
                  <field name="sequence" widget="handle"/>
                  <field name="name"/>
                  <field name="description"/>
                  <field name="is_recommended"/>
                  <button name="action_choose" type="object" string="Choose" class="btn-primary" column_invisible="parent.state != 'open'"/>
                </list>
              </field>
              <group>
                <field name="answer_option_id" invisible="state != 'answered'"/>
                <field name="answer_note" placeholder="Optional: why, or what to change"/>
              </group>
            </sheet>
            <chatter/>
          </form>
        </field>
      </record>

      <record id="view_decision_search" model="ir.ui.view">
        <field name="name">burned.decision.search</field>
        <field name="model">burned.decision</field>
        <field name="arch" type="xml">
          <search>
            <field name="name"/>
            <field name="workstream_id"/>
            <field name="project_id"/>
            <filter name="open" string="Open" domain="[('state', '=', 'open')]"/>
            <filter name="answered" string="Answered" domain="[('state', '=', 'answered')]"/>
            <separator/>
            <filter name="groupby_workstream" string="Workstream" context="{'group_by': 'workstream_id'}"/>
            <filter name="groupby_project" string="Project" context="{'group_by': 'project_id'}"/>
          </search>
        </field>
      </record>

      <record id="action_decisions" model="ir.actions.act_window">
        <field name="name">Decisions</field>
        <field name="res_model">burned.decision</field>
        <field name="view_mode">list,form</field>
        <field name="context">{'search_default_open': 1}</field>
      </record>

      <!-- Workstreams and the dashboard -->
      <record id="view_workstream_kanban" model="ir.ui.view">
        <field name="name">burned.workstream.kanban</field>
        <field name="model">burned.workstream</field>
        <field name="arch" type="xml">
          <kanban create="false">
            <templates>
              <t t-name="card">
                <field name="name" class="fw-bold fs-4"/>
                <field name="description" class="text-muted"/>
                <a name="action_open_decisions" type="object" class="fs-5 mt-2">
                  <field name="decision_open_count"/> open decisions
                </a>
                <a name="action_open_projects" type="object" class="mt-1">
                  Projects: <field name="project_active_count"/> active, <field name="project_approved_count"/> approved,
                  <field name="project_proposal_count"/> in proposal, <field name="project_idea_count"/> ideas
                </a>
              </t>
            </templates>
          </kanban>
        </field>
      </record>

      <record id="view_workstream_list" model="ir.ui.view">
        <field name="name">burned.workstream.list</field>
        <field name="model">burned.workstream</field>
        <field name="arch" type="xml">
          <list>
            <field name="sequence" widget="handle"/>
            <field name="name"/>
            <field name="user_id" widget="many2one_avatar_user"/>
            <field name="description"/>
          </list>
        </field>
      </record>

      <record id="view_workstream_form" model="ir.ui.view">
        <field name="name">burned.workstream.form</field>
        <field name="model">burned.workstream</field>
        <field name="arch" type="xml">
          <form>
            <sheet>
              <div class="oe_title"><h1><field name="name"/></h1></div>
              <group>
                <field name="user_id" widget="many2one_avatar_user"/>
                <field name="description"/>
              </group>
              <field name="project_ids" readonly="1">
                <list>
                  <field name="name"/>
                  <field name="stage_id"/>
                  <field name="user_id" widget="many2one_avatar_user"/>
                </list>
              </field>
            </sheet>
          </form>
        </field>
      </record>

      <record id="action_dashboard" model="ir.actions.act_window">
        <field name="name">Dashboard</field>
        <field name="res_model">burned.workstream</field>
        <field name="view_mode">kanban</field>
        <field name="view_id" ref="view_workstream_kanban"/>
      </record>

      <record id="action_workstreams" model="ir.actions.act_window">
        <field name="name">Workstreams</field>
        <field name="res_model">burned.workstream</field>
        <field name="view_mode">list,form</field>
      </record>

      <!-- Projects: workstream field, filter and grouping -->
      <record id="view_project_form_workstream" model="ir.ui.view">
        <field name="name">project.project.form.workstream</field>
        <field name="model">project.project</field>
        <field name="inherit_id" ref="project.edit_project"/>
        <field name="arch" type="xml">
          <xpath expr="//field[@name='user_id']" position="before">
            <field name="burned_workstream_id"/>
          </xpath>
        </field>
      </record>

      <record id="view_project_search_workstream" model="ir.ui.view">
        <field name="name">project.project.search.workstream</field>
        <field name="model">project.project</field>
        <field name="inherit_id" ref="project.view_project_project_filter"/>
        <field name="arch" type="xml">
          <xpath expr="//search" position="inside">
            <field name="burned_workstream_id"/>
            <filter name="groupby_workstream" string="Workstream" context="{'group_by': 'burned_workstream_id'}"/>
          </xpath>
        </field>
      </record>

      <!-- Menu -->
      <menuitem id="menu_root" name="Workspace" sequence="1"/>
      <menuitem id="menu_dashboard" name="Dashboard" parent="menu_root" action="action_dashboard" sequence="10"/>
      <menuitem id="menu_decisions" name="Decisions" parent="menu_root" action="action_decisions" sequence="20"/>
      <menuitem id="menu_workstreams" name="Workstreams" parent="menu_root" action="action_workstreams" sequence="90"/>
    </odoo>
  data.xml: |
    <odoo>
      <!-- Project stages. Odoo's first two defaults become Idea and Proposal, its Done stays; Approved and Active are added. -->
      <record id="project.project_project_stage_0" model="project.project.stage">
        <field name="name">Idea</field>
        <field name="sequence">10</field>
      </record>
      <record id="project.project_project_stage_1" model="project.project.stage">
        <field name="name">Proposal</field>
        <field name="sequence">12</field>
      </record>
      <record id="project_stage_approved" model="project.project.stage">
        <field name="name">Approved</field>
        <field name="sequence">14</field>
      </record>
      <record id="project_stage_active" model="project.project.stage">
        <field name="name">Active</field>
        <field name="sequence">16</field>
      </record>

      <!-- Project stages are shown to every internal user. -->
      <record id="base.group_user" model="res.groups">
        <field name="implied_ids" eval="[Command.link(ref('project.group_project_stages'))]"/>
      </record>

      <!-- Task stages shared by every workspace project (linked on project creation). -->
      <record id="task_stage_todo" model="project.task.type">
        <field name="name">To do</field>
        <field name="sequence">10</field>
        <field name="burned_default" eval="True"/>
      </record>
      <record id="task_stage_progress" model="project.task.type">
        <field name="name">In progress</field>
        <field name="sequence">20</field>
        <field name="burned_default" eval="True"/>
      </record>
      <record id="task_stage_review" model="project.task.type">
        <field name="name">Review</field>
        <field name="sequence">30</field>
        <field name="burned_default" eval="True"/>
      </record>
      <record id="task_stage_done" model="project.task.type">
        <field name="name">Done</field>
        <field name="sequence">40</field>
        <field name="fold" eval="True"/>
        <field name="burned_default" eval="True"/>
      </record>

      <!-- Workstreams, loaded once: later edits in Odoo are kept. Projects are created by you, never seeded. -->
      <data noupdate="1">
        <record id="ws_homelab" model="burned.workstream">
          <field name="name">Homelab</field>
          <field name="sequence">10</field>
          <field name="description">The k3s cluster, its platform and the network around it.</field>
        </record>
        <record id="ws_jobsearch" model="burned.workstream">
          <field name="name">Job search</field>
          <field name="sequence">20</field>
          <field name="description">Finding a job, applications and AMS reporting.</field>
        </record>

      </data>
    </odoo>
---
