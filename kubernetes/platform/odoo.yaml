apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-burned-config
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: "90"
data:
  __init__.py: |
    import hashlib
    import os

    from odoo import api, models
    from odoo.addons.base.models.res_users import INDEX_SIZE, KEY_CRYPT_CONTEXT


    class ResUsersApikeys(models.Model):
        _inherit = "res.users.apikeys"

        @api.model
        def _burned_set_bot_key(self, login):
            key = os.environ.get("HQ_BOT_API_KEY")
            user = self.env["res.users"].sudo().search([("login", "=", login)])
            if not key or not user:
                return
            self.sudo().search([("user_id", "=", user.id), ("name", "=", "burned")]).unlink()
            self.env.cr.execute(
                "INSERT INTO res_users_apikeys (name, user_id, scope, key, index) VALUES (%s, %s, NULL, %s, %s)",
                ["burned", user.id, KEY_CRYPT_CONTEXT.hash(key), key[:INDEX_SIZE]],
            )


    class McpApiKey(models.Model):
        _inherit = "mn.mcp.api_key"

        @api.model
        def _burned_set_claude_key(self, login):
            """Claude's MCP key: the module mints a random token on create, so the hash is replaced with the
            OpenBao key's (CLAUDE_MCP_KEY). The raw key is never stored in Odoo."""
            key = os.environ.get("CLAUDE_MCP_KEY")
            user = self.env["res.users"].sudo().search([("login", "=", login)])
            if not key or not user:
                return
            vals = {
                "perm_read": True,
                "perm_write": True,
                "perm_create": True,
                "perm_unlink": True,
                "allowed_models": self.env["ir.config_parameter"].sudo().get_param("mn_mcp.default_models"),
            }
            record = self.sudo().search([("user_id", "=", user.id), ("name", "=", "burned")], limit=1)
            if not record:
                record = self.sudo().create({"name": "burned", "user_id": user.id, **vals})
            record.write({**vals, "token": False, "token_hash": hashlib.sha256(key.encode()).hexdigest()})
  __manifest__.py: |
    {
        "name": "Burned configuration",
        "author": "Artur Luppov",
        "version": "19.0.1.0.0",
        "depends": ["auth_oauth", "mail", "project", "mn_mcp_server"],
        "data": ["config.xml"],
        "license": "LGPL-3",
    }
  config.xml: |
    <odoo>
      <!-- Editing this file changes the ConfigMap, which makes Argo CD sync and run the odoo-init hook (update of
           burned_config). A change to the hook alone doesn't trigger a sync: hooks aren't tracked resources. -->
      <record id="provider_keycloak" model="auth.oauth.provider">
        <field name="name">Keycloak</field>
        <field name="body">Log in with Keycloak</field>
        <field name="client_id">odoo</field>
        <field name="enabled" eval="True"/>
        <field name="auth_endpoint">https://auth.burned.host/realms/burned/protocol/openid-connect/auth</field>
        <field name="scope">openid profile email</field>
        <field name="validation_endpoint">https://auth.burned.host/realms/burned/protocol/openid-connect/userinfo</field>
        <field name="css_class">fa fa-fw fa-sign-in text-primary</field>
      </record>
      <record id="auth_oauth.provider_openerp" model="auth.oauth.provider">
        <field name="enabled" eval="False"/>
      </record>
      <!-- Parameters via set_param: base already creates some of them, so records would clash on the key. -->
      <!-- Odoo builds OAuth redirect URLs from web.base.url; left alone it records http:// from the first request. -->
      <function model="ir.config_parameter" name="set_param" eval="['web.base.url', 'https://odoo.burned.host']"/>
      <function model="ir.config_parameter" name="set_param" eval="['web.base.url.freeze', 'True']"/>
      <!-- Odoo's admin is Artur, logging in through Keycloak: oauth_uid is the fixed Keycloak user id (keycloak.yaml). -->
      <record id="base.user_admin" model="res.users">
        <field name="name">Artur Luppov</field>
        <field name="login">admin@burned.host</field>
        <field name="email">admin@burned.host</field>
        <field name="oauth_provider_id" ref="provider_keycloak"/>
        <field name="oauth_uid">434aca5f-5979-407c-b700-fe8c257ce09c</field>
      </record>
      <!-- Bot: chat, comments, tasks, reading mail; no settings. API key from OpenBao (hq-bot-odoo-api-key). -->
      <record id="user_hq_bot" model="res.users">
        <field name="name">HQ Bot</field>
        <field name="login">hq-bot</field>
        <field name="email">hq-bot@burned.host</field>
        <field name="group_ids" eval="[Command.set([ref('base.group_user'), ref('project.group_project_user')])]"/>
      </record>
      <function model="res.users.apikeys" name="_burned_set_bot_key" eval="['hq-bot']"/>
      <!-- MCP endpoint (mn_mcp_server, platform/odoo-mcp.yaml) at https://odoo.burned.host/mcp, used by Claude through
           OAuth as the logged-in user. OAuth sessions get this model list; what they may do comes from the scope the
           client asks for. Destructive or large changes still need a confirmation (the module's defaults). -->
      <function model="ir.config_parameter" name="set_param" eval="['mn_mcp.public_url', 'https://odoo.burned.host']"/>
      <function model="ir.config_parameter" name="set_param" eval="['mn_mcp.default_models', 'burned.decision,burned.decision.option,burned.workstream,mail.message,project.project,project.project.stage,project.task,project.task.type,res.users']"/>
      <function model="ir.config_parameter" name="set_param" eval="['mn_mcp.self_service', 'False']"/>
      <!-- Claude Monet: the AI's own account. Reaches Odoo only through its MCP key (no password, no Keycloak
           login), so everything it does is recorded as Claude, never as Artur. Project Manager: creates projects
           once their proposal is approved. -->
      <record id="user_claude" model="res.users">
        <field name="name">Claude Monet</field>
        <field name="login">claude@burned.host</field>
        <field name="email">claude@burned.host</field>
        <field name="group_ids" eval="[Command.set([ref('base.group_user'), ref('project.group_project_manager')])]"/>
      </record>
      <function model="mn.mcp.api_key" name="_burned_set_claude_key" eval="['claude@burned.host']"/>
      <!-- Keycloak only accepts the token in the Authorization header, not as a URL parameter. -->
      <function model="ir.config_parameter" name="set_param" eval="['auth_oauth.authorization_header', 'True']"/>
    </odoo>
