        - path:
            type: PathPrefix
            value: /websocket
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Host
                value: odoo.burned.host
      backendRefs:
        - name: odoo
          port: 8072
