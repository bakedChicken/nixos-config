apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: 13.2.5
      helm:
        valuesObject:
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - disableDeletion: false
                  editable: true
                  folder: ""
                  name: default
                  options:
                    path: /var/lib/grafana/dashboards/default
                  orgId: 1
                  type: file
          dashboards:
            default:
              kubernetes-kube-state-metrics:
                datasource: Mimir
                gnetId: 21742
                revision: 1
              loki-stack-monitoring:
                datasource: Mimir
                gnetId: 14055
                revision: 5
              node-exporter-full:
                datasource: Mimir
                gnetId: 1860
                revision: 45
              openbao-vault:
                datasource: Mimir
                gnetId: 12904
                revision: 2
              postgres-cloudnativepg:
                datasource: Mimir
                gnetId: 20417
                revision: 4
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - access: proxy
                  name: Loki
                  type: loki
                  url: http://loki-gateway.observability.svc.cluster.local
                - access: proxy
                  name: Tempo
                  type: tempo
                  url: http://tempo.observability.svc.cluster.local:3200
                - access: proxy
                  name: Mimir
                  type: prometheus
                  url: http://mimir-gateway.observability.svc.cluster.local/prometheus
                - access: proxy
                  database: postgres
                  jsonData:
                    postgresVersion: 1800
                    sslmode: disable
                  name: Postgres
                  secureJsonData:
                    password: $GRAFANA_POSTGRES_PASSWORD
                  type: postgres
                  url: default-postgres-cluster-rw.postgres.svc.cluster.local:5432
                  user: grafana
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                key: client_secret
                name: grafana-oidc-client-secret
            GRAFANA_POSTGRES_PASSWORD:
              secretKeyRef:
                key: password
                name: grafana-postgres-creds
          grafana.ini:
            auth.generic_oauth:
              allow_assign_grafana_admin: true
              api_url: https://auth.burned.host/realms/homelab/protocol/openid-connect/userinfo
              auth_url: https://auth.burned.host/realms/homelab/protocol/openid-connect/auth
              client_id: grafana
              enabled: true
              name: Keycloak
              role_attribute_path: contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'
              role_attribute_strict: false
              scopes: openid profile email
              token_url: https://auth.burned.host/realms/homelab/protocol/openid-connect/token
              use_pkce: true
            server:
              root_url: https://grafana.internal.k8s.burned.host
          route:
            main:
              enabled: true
              hostnames:
                - grafana.internal.k8s.burned.host
              parentRefs:
                - name: burned-gateway
                  namespace: gateway-system
                  sectionName: internal-https
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
