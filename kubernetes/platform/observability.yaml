apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: grafana
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "69"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  cluster:
    name: default-postgres-cluster
  name: grafana
  login: true
  inRoles:
    - pg_read_all_data
  passwordSecret:
    name: grafana-postgres-creds
