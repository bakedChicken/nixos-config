apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: 13.2.5
      helm:
        valuesObject:
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - disableDeletion: false
                  editable: true
                  folder: ""
                  name: default
                  options:
                    path: /var/lib/grafana/dashboards/default
                  orgId: 1
                  type: file
          dashboards:
            default:
              kubernetes-kube-state-metrics:
                gnetId: 21742
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
                  - name: VAR_DATASOURCE
                    value: prometheus
              mikrotik-mktxp:
                gnetId: 13679
                revision: 32
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              loki-stack-monitoring:
                gnetId: 14055
                revision: 5
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
                  - name: DS_LOKI
                    value: loki
              node-exporter-full:
                gnetId: 1860
                revision: 45
              openbao-vault:
                gnetId: 12904
                revision: 2
                datasource:
                  - name: DS_PROMXY
                    value: prometheus
              postgres-cloudnativepg:
                gnetId: 20417
                revision: 4
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
                  - name: DS_EXPRESSION
                    value: __expr__
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - access: proxy
                  name: Loki
                  uid: loki
                  type: loki
                  url: http://loki.observability.svc.cluster.local:3100
                - access: proxy
                  name: Tempo
                  type: tempo
                  url: http://tempo.observability.svc.cluster.local:3200
                - access: proxy
                  name: Prometheus
                  uid: prometheus
                  isDefault: true
                  type: prometheus
                  url: http://vmselect-metrics.observability.svc.cluster.local:8481/select/0/prometheus
                - access: proxy
                  name: Alertmanager
                  type: alertmanager
                  url: http://vmalertmanager-main.observability.svc.cluster.local:9093
                  jsonData:
                    handleGrafanaManagedAlerts: false
                    implementation: prometheus
                - access: proxy
                  name: Pyroscope
                  type: grafana-pyroscope-datasource
                  url: http://pyroscope-query-frontend.observability.svc.cluster.local:4040
                - access: proxy
                  database: postgres
                  jsonData:
                    postgresVersion: 1800
                    sslmode: disable
                  name: Postgres
                  secureJsonData:
                    password: $GRAFANA_POSTGRES_PASSWORD
                  type: postgres
                  url: default-postgres-cluster-rw.postgres.svc.cluster.local:5432
                  user: grafana
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                key: client_secret
                name: grafana-oidc-client-secret
            GRAFANA_POSTGRES_PASSWORD:
              secretKeyRef:
                key: password
                name: grafana-postgres-creds
          grafana.ini:
            auth:
              disable_login_form: true
            auth.generic_oauth:
              allow_assign_grafana_admin: true
              api_url: https://auth.burned.host/realms/burned/protocol/openid-connect/userinfo
              auth_url: https://auth.burned.host/realms/burned/protocol/openid-connect/auth
              client_id: grafana
              enabled: true
              name: Keycloak
              role_attribute_path: contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'
              role_attribute_strict: false
              scopes: openid profile email
              token_url: https://auth.burned.host/realms/burned/protocol/openid-connect/token
              use_pkce: true
            server:
              root_url: https://grafana.internal.k8s.burned.host
          route:
            main:
              enabled: true
              hostnames:
                - grafana.internal.k8s.burned.host
              parentRefs:
                - name: burned-gateway
                  namespace: gateway-system
                  sectionName: internal-https
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
