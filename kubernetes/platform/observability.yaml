        app.kubernetes.io/name: nisshi
    spec:
      containers:
        - name: nisshi
          image: ghcr.io/nisshi-io/nisshi:0.7.0-pre.2
          args:
            - --kafka-cluster-id=nisshi
            - --kafka-listener-url=tcp://0.0.0.0:9092/
            - --kafka-advertised-listener-url=tcp://nisshi.observability.svc.cluster.local:9092
            - --storage-engine=s3://nisshi/
          env:
            - name: RUST_LOG
              value: warn,nisshi_broker=info,nisshi_storage=info
            - name: AWS_ENDPOINT
              value: http://rustfs-svc.rustfs-system.svc.cluster.local:9000
            - name: AWS_ALLOW_HTTP
              value: "true"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          envFrom:
