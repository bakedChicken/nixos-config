apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: loki
      targetRevision: 18.13.3
      helm:
        valuesObject:
          backend:
            replicas: 0
          deploymentMode: Monolithic
          global:
            extraArgs:
              - "-config.expand-env=true"
            extraEnvFrom:
              - secretRef:
                  name: loki-rustfs-creds
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 3
            # Drop ingesters that stopped heartbeating (e.g. a pod that came back with a new IP) instead of keeping
            # them in the ring forever, where they block writes and readiness.
            ingester:
              autoforget_unhealthy: true
            schemaConfig:
              configs:
                - from: "2026-01-01"
                  index:
                    period: 24h
                    prefix: index_
                  object_store: s3
                  schema: v13
                  store: tsdb
            storage:
              bucketNames:
                chunks: loki
                ruler: loki
              s3:
                accessKeyId: ${AWS_ACCESS_KEY_ID}
                endpoint: rustfs-svc.rustfs-system.svc.cluster.local:9000
                insecure: true
                region: us-east-1
                s3ForcePathStyle: true
                secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
              type: s3
          read:
            replicas: 0
          singleBinary:
            podAnnotations:
              k8s.grafana.com/metrics.container: loki
              prometheus.io/port: "3100"
              prometheus.io/scrape: "true"
            replicas: 3
          gateway:
            enabled: false
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false
          write:
            replicas: 0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
