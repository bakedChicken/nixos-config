apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "69"
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
      }
    }

    discovery.relabel "metrics" {
      targets = discovery.relabel.pods.output

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        action        = "replace"
        target_label  = "__metrics_path__"
        regex         = "(.+)"
      }
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        action        = "replace"
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }
    }

    prometheus.scrape "kubernetes_pods" {
      targets    = discovery.relabel.metrics.output
      forward_to = [prometheus.remote_write.mimir.receiver]
      params = {
        format = ["prometheus"],
      }
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-gateway.observability.svc.cluster.local/api/v1/push"
      }
    }

    prometheus.exporter.unix "node" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
    }

    prometheus.scrape "node" {
      targets    = prometheus.exporter.unix.node.targets
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    otelcol.receiver.otlp "instrumentation" {
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces  = [otelcol.exporter.otlp.tempo.input]
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.loki.default.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.observability.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.default.receiver]
    }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: loki
      targetRevision: 18.13.3
      helm:
        valuesObject:
          backend:
            replicas: 0
          deploymentMode: Monolithic
          global:
            extraArgs:
              - "-config.expand-env=true"
            extraEnvFrom:
              - secretRef:
                  name: loki-rustfs-creds
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: "2026-01-01"
                  index:
                    period: 24h
                    prefix: index_
                  object_store: s3
                  schema: v13
                  store: tsdb
            storage:
              bucketNames:
                chunks: loki
                ruler: loki
              s3:
                accessKeyId: ${AWS_ACCESS_KEY_ID}
                endpoint: rustfs-svc.rustfs-system.svc.cluster.local:9000
                insecure: true
                region: us-east-1
                s3ForcePathStyle: true
                secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
              type: s3
          read:
            replicas: 0
          singleBinary:
            podAnnotations:
              prometheus.io/port: "3100"
              prometheus.io/scrape: "true"
            replicas: 1
          write:
            replicas: 0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: tempo
      targetRevision: 3.0.0
      helm:
        valuesObject:
          podAnnotations:
            prometheus.io/port: "3200"
            prometheus.io/scrape: "true"
          tempo:
            extraArgs:
              config.expand-env: "true"
            extraEnvFrom:
              - secretRef:
                  name: tempo-rustfs-creds
            storage:
              trace:
                backend: s3
                s3:
                  access_key: ${AWS_ACCESS_KEY_ID}
                  bucket: tempo
                  endpoint: rustfs-svc.rustfs-system.svc.cluster.local:9000
                  insecure: true
                  secret_key: ${AWS_SECRET_ACCESS_KEY}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
