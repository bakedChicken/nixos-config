apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "71"
data:
  mimir.yaml: |
    # "all" without query-frontend/scheduler: with ingest storage, the query-frontend's and the ingester's Kafka offset
    # readers register the same metrics and Mimir 3.2.1 panics. The querier serves the query API itself then.
    target: distributor,ingester,querier,store-gateway,compactor,ruler
    multitenancy_enabled: false

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info

    common:
      storage:
        backend: s3
        s3:
          endpoint: rustfs-svc.rustfs-system.svc.cluster.local:9000
          region: us-east-1
          access_key_id: ${AWS_ACCESS_KEY_ID}
          secret_access_key: ${AWS_SECRET_ACCESS_KEY}
          insecure: true

    ingest_storage:
      enabled: true
      kafka:
        address: nisshi.observability.svc.cluster.local:9092
        topic: mimir-ingest
        auto_create_topic_enabled: true
        auto_create_topic_default_partitions: 1

    ingester:
      push_grpc_method_enabled: false
      ring:
        replication_factor: 1
      partition_ring:
        min_partition_owners_count: 1

    store_gateway:
      sharding_ring:
        replication_factor: 1

    blocks_storage:
      s3:
        bucket_name: mimir-blocks
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync

    compactor:
      data_dir: /data/compactor

    ruler:
      rule_path: /data/ruler
    ruler_storage:
      s3:
        bucket_name: mimir-ruler

    alertmanager:
      data_dir: /data/alertmanager
    alertmanager_storage:
      s3:
        bucket_name: mimir-alertmanager

    # Single-tenant homelab: generous limits instead of the multi-tenant abuse protection defaults, which drop
    # whole remote_write batches (kube-state-metrics alone pushes ~8500 samples per scrape).
    limits:
      ingestion_rate: 1000000
      ingestion_burst_size: 10000000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "71"
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mimir
          image: grafana/mimir:3.2.1
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
          envFrom:
            - secretRef:
                name: mimir-rustfs-creds
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tns-csi-nvmeof
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-gateway
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "71"
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http
      port: 80
      targetPort: http
