apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: pyroscope
      targetRevision: 2.3.1
      helm:
        valuesObject:
          alloy:
            enabled: false
          architecture:
            microservices:
              enabled: true
          pyroscope:
            extraArgs:
              config.expand-env: "true"
              log.level: info
            extraEnvFrom:
              - secretRef:
                  name: pyroscope-rustfs-creds
            podAnnotations:
              prometheus.io/port: "4040"
              prometheus.io/scrape: "true"
            structuredConfig:
              storage:
                backend: s3
                s3:
                  access_key_id: ${AWS_ACCESS_KEY_ID}
                  bucket_name: pyroscope
                  endpoint: rustfs-svc.rustfs-system.svc.cluster.local:9000
                  force_path_style: true
                  insecure: true
                  region: us-east-1
                  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
            components:
              distributor:
                replicaCount: 2
                resources: &small
                  limits:
                    memory: 1Gi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                affinity:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/component: distributor
                          topologyKey: kubernetes.io/hostname
              query-frontend:
                replicaCount: 2
                resources: *small
                affinity:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/component: query-frontend
                          topologyKey: kubernetes.io/hostname
              query-backend:
                replicaCount: 2
                resources: *small
                affinity:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/component: query-backend
                          topologyKey: kubernetes.io/hostname
              segment-writer:
                replicaCount: 3
                resources:
                  limits:
                    memory: 2Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/component: segment-writer
                        topologyKey: kubernetes.io/hostname
              compaction-worker:
                replicaCount: 2
                resources: *small
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/component: compaction-worker
                        topologyKey: kubernetes.io/hostname
              metastore:
                replicaCount: 3
                persistence:
                  enabled: true
                  size: 2Gi
                resources: *small
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/component: metastore
                        topologyKey: kubernetes.io/hostname
              tenant-settings:
                resources: *small
              ad-hoc-profiles:
                resources: *small
              admin:
                resources: *small
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
