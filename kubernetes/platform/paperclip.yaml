apiVersion: v1
kind: Namespace
metadata:
  name: paperclip
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: paperclip
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  cluster:
    name: default-postgres-cluster
  name: paperclip
  login: true
  passwordSecret:
    name: paperclip-db-creds
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: paperclip
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  cluster:
    name: default-postgres-cluster
  name: paperclip
  owner: paperclip
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-db-creds
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperclip-db-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: paperclip
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: paperclip-postgres-creds
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-env
  namespace: paperclip
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperclip-env
    template:
      data:
        DATABASE_URL: "postgres://paperclip:{{ .password }}@default-postgres-cluster-rw.postgres.svc.cluster.local:5432/paperclip"
        BETTER_AUTH_SECRET: "{{ .better_auth }}"
        PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "{{ .tool_signing }}"
  data:
    - secretKey: password
      remoteRef:
        key: paperclip-postgres-creds
        property: password
    - secretKey: better_auth
      remoteRef:
        key: paperclip-better-auth-secret
        property: secret
    - secretKey: tool_signing
      remoteRef:
        key: paperclip-tool-signing-secret
        property: secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-data
  namespace: paperclip
  annotations:
    argocd.argoproj.io/sync-wave: "94"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  annotations:
    argocd.argoproj.io/sync-wave: "95"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:2026.916.1@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
          env:
            - name: PAPERCLIP_PUBLIC_URL
              value: https://paperclip.burned.host
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: "true"
          envFrom:
            - secretRef:
                name: paperclip-env
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: data
              mountPath: /paperclip
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-data
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  annotations:
    argocd.argoproj.io/sync-wave: "95"
spec:
  selector:
    app.kubernetes.io/name: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
  namespace: paperclip
  annotations:
    argocd.argoproj.io/sync-wave: "96"
spec:
  parentRefs:
    - name: burned-gateway
      namespace: gateway-system
      sectionName: wildcard-https
  hostnames:
    - paperclip.burned.host
  rules:
    - backendRefs:
        - name: paperclip
          port: 3100
