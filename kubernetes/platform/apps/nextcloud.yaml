apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: nextcloud
  namespace: postgres
spec:
  name: nextcloud
  passwordSecret:
    name: nextcloud-pg-creds
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud
  namespace: postgres
spec:
  name: nextcloud
  owner: nextcloud
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-pg-creds
  namespace: postgres
spec:
  target:
    name: nextcloud-pg-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: nextcloud
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: nextcloud/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-pg-creds
  namespace: nextcloud
spec:
  target:
    name: nextcloud-pg-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: nextcloud
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: nextcloud/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  target:
    name: nextcloud-admin
    template:
      data:
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: nextcloud/admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc-client-secret
  namespace: nextcloud
spec:
  target:
    name: nextcloud-oidc-client-secret
  dataFrom:
    - extract:
        key: nextcloud/oidc-client
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: platform
  destination:
    namespace: nextcloud
  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.4.0
      helm:
        valuesObject:
          nextcloud:
            host: nextcloud.burned.host
            existingSecret:
              enabled: true
              secretName: nextcloud-admin
              usernameKey: username
              passwordKey: password
            extraEnv:
              - name: AGENTS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-agents
                    key: password
              - name: OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-oidc-client-secret
                    key: client_secret
            hooks:
              before-starting: |-
                php /var/www/html/occ app:install user_oidc || php /var/www/html/occ app:enable user_oidc
                php /var/www/html/occ app:install deck || php /var/www/html/occ app:enable deck
                php /var/www/html/occ app:install tables || php /var/www/html/occ app:enable tables
                php /var/www/html/occ user_oidc:provider Keycloak --clientid=nextcloud --clientsecret="$OIDC_CLIENT_SECRET" --discoveryuri=https://auth.burned.host/realms/burned/.well-known/openid-configuration --unique-uid=0 --mapping-uid=preferred_username --mapping-display-name=name --mapping-email=email
                php /var/www/html/occ user:info agents >/dev/null 2>&1 || OC_PASS="$AGENTS_PASSWORD" php /var/www/html/occ user:add --password-from-env --display-name=Agents agents
                OC_PASS="$AGENTS_PASSWORD" php /var/www/html/occ user:resetpassword --password-from-env agents >/dev/null
                for app in firstrunwizard recommendations photos dashboard weather_status user_status survey_client support contactsinteraction privacy nextcloud_announcements; do php /var/www/html/occ app:disable $app >/dev/null 2>&1 || true; done
            configs:
              burned.config.php: |-
                <?php
                $CONFIG = array (
                  "trusted_domains" => array ("nextcloud.burned.host", "localhost"),
                  "overwriteprotocol" => "https",
                  "overwrite.cli.url" => "https://nextcloud.burned.host",
                  "trusted_proxies" => array ("fd42::/56"),
                  "allow_local_remote_servers" => true,
                  "skeletondirectory" => "",
                  "templatedirectory" => "",
                  "defaultapp" => "files",
                );
          internalDatabase:
            enabled: false
          externalDatabase:
            type: postgresql
            host: default-postgres-cluster-rw.postgres.svc.cluster.local
            existingSecret:
              enabled: true
              secretName: nextcloud-pg-creds
              usernameKey: username
              passwordKey: password
          persistence:
            enabled: true
            storageClass: iscsi
            size: 20Gi
          startupProbe:
            enabled: true
            failureThreshold: 60
          cronjob:
            enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  hostnames:
    - nextcloud.burned.host
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-agents
  namespace: nextcloud
spec:
  target:
    name: nextcloud-agents
  data:
    - secretKey: password
      remoteRef:
        key: nextcloud/agents
        property: password
