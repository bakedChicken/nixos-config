apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: demo
  namespace: postgres
spec:
  name: demo
  passwordSecret:
    name: demo-pg-creds
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: demo
  namespace: postgres
spec:
  name: demo
  owner: demo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-pg-creds
  namespace: postgres
spec:
  target:
    name: demo-pg-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: demo
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: demo/db
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: apps
  destination:
    namespace: app-demo
  source:
    repoURL: oci://ghcr.io/bakedchicken/demo-deploy
    targetRevision: latest
    path: .
