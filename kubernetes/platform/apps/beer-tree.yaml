apiVersion: v1
kind: Namespace
metadata:
  name: app-beer-tree
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: beertree
  namespace: postgres
spec:
  name: beertree
  passwordSecret:
    name: beer-tree-pg-creds
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: beertree
  namespace: postgres
spec:
  name: beertree
  owner: beertree
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beer-tree-pg-creds
  namespace: postgres
spec:
  target:
    name: beer-tree-pg-creds
    template:
      type: kubernetes.io/basic-auth
      data:
        username: beertree
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: beer-tree/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beer-tree
  namespace: app-beer-tree
spec:
  target:
    name: beer-tree
    template:
      data:
        DATABASE_URL: "postgresql://beertree:{{ .db_password }}@default-postgres-cluster-rw.postgres.svc.cluster.local:5432/beertree"
        S3_ENDPOINT: http://rustfs-svc.rustfs-system.svc.cluster.local:9000
        S3_PUBLIC_ENDPOINT: https://s3.internal.k8s.burned.host
        S3_BUCKET: beer-tree
        S3_ACCESS_KEY: beer-tree
        S3_SECRET_KEY: "{{ .rustfs_secret_key }}"
        APP_TOKEN: "{{ .app_token }}"
        RUNNER_TOKEN: "{{ .runner_token }}"
        OIDC_CLIENT_SECRET: "{{ .admin_client_secret }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .admin_cookie_secret }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: beer-tree/db
        property: password
    - secretKey: rustfs_secret_key
      remoteRef:
        key: beer-tree/rustfs
        property: secret_key
    - secretKey: app_token
      remoteRef:
        key: beer-tree/app-token
        property: token
    - secretKey: runner_token
      remoteRef:
        key: beer-tree/runner-token
        property: token
    - secretKey: admin_client_secret
      remoteRef:
        key: beer-tree/admin-oidc-client
        property: client_secret
    - secretKey: admin_cookie_secret
      remoteRef:
        key: beer-tree/admin-cookie
        property: secret
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beer-tree
  namespace: argocd
spec:
  project: apps
  destination:
    namespace: app-beer-tree
  source:
    repoURL: oci://ghcr.io/bakedchicken/beer-tree-deploy
    targetRevision: latest
    path: .
