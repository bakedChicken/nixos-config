apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-config-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-config-operator
  sources:
    - repoURL: https://redhat-cop.github.io/vault-config-operator
      chart: vault-config-operator
      targetRevision: v1.0.2
      helm:
        valuesObject:
          enableCertManager: true
          enableMonitoring: false
          env:
            - name: VAULT_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
            - name: ENABLE_DRIFT_DETECTION
              value: "true"
            - name: SYNC_PERIOD_SECONDS
              value: "300"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-config-operator
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "20"
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: SecretEngineMount
metadata:
  name: secret
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  type: kv
  options:
    version: "2"
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: external-secrets
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  type: acl
  policy: |
    path "secret/data/*" {
      capabilities = ["create", "read", "update"]
    }
    path "secret/metadata/*" {
      capabilities = ["create", "read", "update", "list"]
    }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: external-secrets
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  path: kubernetes
  policies:
    - external-secrets
  targetServiceAccounts:
    - external-secrets-openbao
  targetNamespaces:
    targetNamespaces:
      - external-secrets
  tokenTTL: 3600
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: openbao.oidc-client
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  path: secret/data/openbao
  name: oidc-client
  isKVSecretsEngineV2: true
  kvSecretRetainPolicy: Retain
  secretKey: client_secret
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
