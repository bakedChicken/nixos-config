apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata:
  name: oidc
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  path: sso
  name: keycloak
  config:
    listingVisibility: unauth
  type: oidc
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineConfig
metadata:
  name: oidc
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  path: sso/keycloak
  OIDCDiscoveryURL: https://auth.burned.host/realms/burned
  OIDCClientID: openbao
  OIDCCredentials:
    secret:
      name: openbao-oidc-client-secret
    passwordKey: client_secret
  defaultRole: default
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: default
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator
  path: sso/keycloak
  name: default
  roleType: oidc
  userClaim: sub
  OIDCScopes:
    - openid
    - profile
    - email
  allowedRedirectURIs:
    - https://openbao.internal.k8s.burned.host/ui/vault/auth/sso/keycloak/oidc/callback
    - https://openbao.internal.k8s.burned.host/v1/auth/sso/keycloak/oidc/callback
    - http://localhost:8250/oidc/callback
  tokenTTL: 1h
  boundClaims:
    groups:
      - admin
  boundClaimsType: string
  tokenPolicies:
    - admin
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
