apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartctl-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app: smartctl-exporter
  template:
    metadata:
      labels:
        app: smartctl-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9633"
        prometheus.io/path: /metrics
    spec:
      nodeSelector:
        storage.burned.host/zfs: "true"
      containers:
        - name: smartctl-exporter
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: metrics
              containerPort: 9633
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: dev
          hostPath:
            path: /dev
