apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://edge.burned.host:6443
    namespace: cert-manager
  sources:
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        valuesObject:
          config:
            gatewayAPI:
              enabled: true
          crds:
            enabled: true
          extraArgs:
            - --dns01-recursive-nameservers-only
            - --dns01-recursive-nameservers=https://1.1.1.1/dns-query
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
