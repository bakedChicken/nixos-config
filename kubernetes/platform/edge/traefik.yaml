apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://edge.burned.host:6443
    namespace: traefik
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 42.1.3
      helm:
        valuesObject:
          providers:
            kubernetesGateway:
              enabled: true
              experimentalChannel: true
          gatewayClass:
            enabled: true
          gateway:
            enabled: false
          nodeSelector:
            storage.burned.host/zfs: "true"
          ports:
            cdp:
              port: 9222
              expose:
                default: true
              exposedPort: 9222
              protocol: TCP
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
