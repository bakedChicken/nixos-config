      port: 8989
      targetPort: 8989
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: edge
      namespace: gateway-system
      sectionName: https
  hostnames:
    - sonarr.internal.edge.burned.host
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
