---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        storage.burned.host/zfs: "true"
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        supplementalGroups: [568]
      containers:
        - name: radarr
          image: ghcr.io/home-operations/radarr:6.4.4.10685@sha256:1902ad2c08e9bac276ff9a1429af2eaa2f3c635a51f138f1b3eb734995171537
          env:
            - name: TZ
              value: "Europe/Vienna"
            - name: UMASK
              value: "002"
            - name: RADARR__APP__INSTANCENAME
              value: "Radarr"
          ports:
            - name: http
              containerPort: 7878
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /srv/media
      volumes:
        - name: config
          hostPath:
            path: /srv/apps/radarr
            type: Directory
        - name: media
          hostPath:
            path: /srv/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: 7878
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: media
spec:
  parentRefs:
    - name: edge
      namespace: gateway-system
      sectionName: https
  hostnames:
    - radarr.internal.edge.burned.host
  rules:
    - backendRefs:
        - name: radarr
          port: 7878
---
apiVersion: apps/v1
