apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://edge.burned.host:6443
    namespace: gateway-system
  source:
    repoURL: oci://ghcr.io/bakedchicken/platform
    targetRevision: latest
    path: edge/gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
